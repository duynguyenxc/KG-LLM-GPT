[project]
name = "res-pipeline"
version = "0.1.0"
description = "Agentic, human-in-the-loop GraphRAG pipeline for realist evidence synthesis (RRE 2026 worked example: Richmond et al. 2020)"
authors = [{ name = "Duy Nguyen" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "graphrag>=2.7",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pypdf>=4.2",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
viz = ["pyvis>=0.3", "graphviz>=0.20", "openpyxl>=3.1"]

[project.scripts]
res = "res_pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
